<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacto por WhatsApp</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #e0f7fa, #fce4ec);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .whatsapp-icon {
      font-size: 60px;
      color: #25d366;
      margin-bottom: 10px;
    }

    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin: 5px 0 15px;
    }

    .whatsapp-number {
      display: block;
      font-size: 18px;
      color: #25d366;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: #25d366;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      transition: background 0.3s ease;
      margin-top: 10px;
    }

    .btn:hover {
      background: #1ebe5d;
    }

    .home-btn {
      background: #0288d1;
    }

    .home-btn:hover {
      background: #0277bd;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="whatsapp-icon">📱</div>
    <h1>¿Tienes dudas?</h1>
    <p>Contáctanos por WhatsApp, con gusto te ayudamos.</p>
    <p class="whatsapp-number">📞 +52 123 456 7890</p>
    <p><strong>Horario:</strong> Lunes a Viernes, de 8:00 am a 10:00 pm</p>

    <a class="btn" href="https://wa.me/521234567890" target="_blank">Enviar mensaje por WhatsApp</a><br><br>
    <a class="btn home-btn" href="index.html">Volver a la página principal</a>
  </div>

</body>
</html>
